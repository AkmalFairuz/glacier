worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format glacier '$remote_addr "$request" $status $body_bytes_sent '
                       'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout glacier;

    # Docker's embedded DNS; re-resolve so scaled backend replicas are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream glacier_backend {
        zone glacier_backend 64k;
        server backend:3000 resolve;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Connection counters for nginx-prometheus-exporter. Port 8081 is not published to the host.
    server {
        listen 8081;
        access_log off;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 26m;

        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://glacier_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health of the API behind nginx (the backend answers it).
        location = /health {
            proxy_pass http://glacier_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /gateway {
            proxy_pass http://glacier_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Uploaded files live in the MinIO bucket (anonymous read).
        location /files/ {
            set $minio http://minio:9000;
            rewrite ^/files/(.*)$ /glacier-uploads/$1 break;
            proxy_pass $minio;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
            add_header X-Content-Type-Options nosniff;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'";
            expires 30d;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
