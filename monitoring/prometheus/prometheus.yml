# Prometheus for Glacier. Only reachable inside the Compose network (Grafana uses it as a data source).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Every backend replica: Docker DNS returns one A record per container, so scaling with
  # `docker compose up --scale backend=N` adds targets without a config change.
  - job_name: backend
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter-primary:9104"]
        labels:
          role: primary
      - targets: ["mysqld-exporter-replica:9104"]
        labels:
          role: replica

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
