name: glacier

services:
  mariadb-primary:
    image: mariadb:11.4
    command:
      - --server-id=1
      - --log-bin=mariadb-bin
      - --log-basename=primary
      - --binlog-format=ROW
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER:?set MARIADB_REPLICATION_USER in .env}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD:?set MARIADB_REPLICATION_PASSWORD in .env}
    volumes:
      - mariadb-primary:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - glacier-net

  mariadb-replica:
    image: mariadb:11.4
    command:
      - --server-id=2
      - --log-basename=replica
      - --read-only=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # The database and the glacier user arrive through replication.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_MASTER_HOST: mariadb-primary
      MARIADB_MASTER_PORT: 3306
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER:?set MARIADB_REPLICATION_USER in .env}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD:?set MARIADB_REPLICATION_PASSWORD in .env}
    volumes:
      - mariadb-replica:/var/lib/mysql
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - glacier-net

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - glacier-net

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Lets Prometheus scrape /minio/v2/metrics/cluster without a token (port 9000 is internal).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - glacier-net

  backend:
    build:
      context: ./backend
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-primary:3306/${MARIADB_DATABASE}
      DATABASE_READ_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-replica:3306/${MARIADB_DATABASE}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: glacier-uploads
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PUBLIC_FILES_PREFIX: /files
      STUN_URLS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      RUST_LOG: glacier=info,tower_http=info
    deploy:
      replicas: 3
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - glacier-net

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - glacier-net

  # Monitoring. Prometheus and the exporters are internal; see monitoring/ for configuration.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - glacier-net

  # Creates the read-only monitoring user on the primary; it reaches the replica through replication.
  mariadb-monitor-user:
    image: mariadb:11.4
    command:
      - mariadb
      - --host=mariadb-primary
      - --user=root
      - --password=${MARIADB_ROOT_PASSWORD}
      # ALTER USER keeps the password in sync when it changes in .env.
      - --execute=CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY '${MARIADB_EXPORTER_PASSWORD}' WITH MAX_USER_CONNECTIONS 3; ALTER USER 'exporter'@'%' IDENTIFIED BY '${MARIADB_EXPORTER_PASSWORD}'; GRANT PROCESS, BINLOG MONITOR, REPLICA MONITOR, SELECT ON *.* TO 'exporter'@'%';
    depends_on:
      mariadb-primary:
        condition: service_healthy
    restart: "no"
    networks:
      - glacier-net

  mysqld-exporter-primary:
    image: prom/mysqld-exporter:v0.21.0
    command: ["--mysqld.address=mariadb-primary:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_EXPORTER_PASSWORD:?set MARIADB_EXPORTER_PASSWORD in .env}
    depends_on:
      mariadb-monitor-user:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - glacier-net

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.21.0
    command: ["--mysqld.address=mariadb-replica:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MARIADB_EXPORTER_PASSWORD:?set MARIADB_EXPORTER_PASSWORD in .env}
    depends_on:
      mariadb-replica:
        condition: service_healthy
      mariadb-monitor-user:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - glacier-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - glacier-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    networks:
      - glacier-net

  # Host metrics: CPU, memory, disk, network, load (on Docker Desktop this is the Docker VM).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|securityfs|squashfs|sysfs|tmpfs|tracefs|virtiofs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    restart: unless-stopped
    networks:
      - glacier-net

  # Per-container CPU, memory, network and disk I/O.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --enable_metrics=cpu,memory,network,diskIO,oom_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - glacier-net

  # Dashboards at http://localhost:3001 (login from .env). The only monitoring port on the host.
  grafana:
    image: grafana/grafana:13.2.5
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/backend.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - glacier-net

volumes:
  mariadb-primary:
  mariadb-replica:
  redis:
  minio:
  prometheus:
  grafana:

# One user-defined bridge network for every service; containers reach each other by service name.
networks:
  glacier-net:
    name: glacier-net
    driver: bridge
