name: glacier

services:
  mariadb-primary:
    image: mariadb:11.4
    command:
      - --server-id=1
      - --log-bin=mariadb-bin
      - --log-basename=primary
      - --binlog-format=ROW
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: glacier-root
      MARIADB_DATABASE: glacier
      MARIADB_USER: glacier
      MARIADB_PASSWORD: glacier
      MARIADB_REPLICATION_USER: replicator
      MARIADB_REPLICATION_PASSWORD: replicator-pass
    volumes:
      - mariadb-primary:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb-replica:
    image: mariadb:11.4
    command:
      - --server-id=2
      - --log-basename=replica
      - --read-only=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # The database and the glacier user arrive through replication.
      MARIADB_ROOT_PASSWORD: glacier-root
      MARIADB_MASTER_HOST: mariadb-primary
      MARIADB_MASTER_PORT: 3306
      MARIADB_REPLICATION_USER: replicator
      MARIADB_REPLICATION_PASSWORD: replicator-pass
    volumes:
      - mariadb-replica:/var/lib/mysql
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: glacier
      MINIO_ROOT_PASSWORD: glacier-secret
      # Lets Prometheus scrape /minio/v2/metrics/cluster without a token (port 9000 is internal).
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATABASE_URL: mysql://glacier:glacier@mariadb-primary:3306/glacier
      DATABASE_READ_URL: mysql://glacier:glacier@mariadb-replica:3306/glacier
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: glacier-uploads
      S3_ACCESS_KEY: glacier
      S3_SECRET_KEY: glacier-secret
      PUBLIC_FILES_PREFIX: /files
      STUN_URLS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      RUST_LOG: glacier=info,tower_http=info
    deploy:
      replicas: 3
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Monitoring. Prometheus and the exporters are internal; see monitoring/ for configuration.
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the read-only monitoring user on the primary; it reaches the replica through replication.
  mariadb-monitor-user:
    image: mariadb:11.4
    command:
      - mariadb
      - --host=mariadb-primary
      - --user=root
      - --password=glacier-root
      - --execute=CREATE USER IF NOT EXISTS 'exporter'@'%' IDENTIFIED BY 'exporter-pass' WITH MAX_USER_CONNECTIONS 3; GRANT PROCESS, BINLOG MONITOR, REPLICA MONITOR, SELECT ON *.* TO 'exporter'@'%';
    depends_on:
      mariadb-primary:
        condition: service_healthy
    restart: "no"

  mysqld-exporter-primary:
    image: prom/mysqld-exporter:v0.21.0
    command: ["--mysqld.address=mariadb-primary:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter-pass
    depends_on:
      mariadb-monitor-user:
        condition: service_completed_successfully
    restart: unless-stopped

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.21.0
    command: ["--mysqld.address=mariadb-replica:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter-pass
    depends_on:
      mariadb-replica:
        condition: service_healthy
      mariadb-monitor-user:
        condition: service_completed_successfully
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb-primary:
  mariadb-replica:
  redis:
  minio:
  prometheus:
