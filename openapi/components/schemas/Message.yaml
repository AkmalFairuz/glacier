# Generated from the backend handlers (utoipa). Do not edit; run `cargo run -- openapi` in backend/.
type: object
required:
- attachments
- author
- channel_id
- content
- created_at
- edited_at
- embeds
- id
- reactions
- referenced_message
- reply_to_id
properties:
  attachments:
    type: array
    items:
      $ref: ./Attachment.yaml
  author:
    $ref: ./User.yaml
  channel_id:
    $ref: ./Id.yaml
  content:
    type: string
  created_at:
    type: string
    format: date-time
  edited_at:
    type:
    - string
    - 'null'
    format: date-time
  embeds:
    type: array
    items:
      $ref: ./Embed.yaml
    description: Link previews, added a moment after the message by `MESSAGE_UPDATE`.
  id:
    $ref: ./Id.yaml
  reactions:
    type: array
    items:
      $ref: ./Reaction.yaml
  referenced_message:
    oneOf:
    - type: 'null'
    - $ref: ./ReferencedMessage.yaml
      description: The original message; `null` with `reply_to_id` set means it was deleted.
  reply_to_id:
    oneOf:
    - type: 'null'
    - $ref: ./Id.yaml
      description: Set when this message is a reply, even if the original was deleted since.
